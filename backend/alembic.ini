[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s

sys_path = .

sqlalchemy.url = postgresql+asyncpg://aimos_user:aimos_password@localhost:5432/aimos_db

[post_write_hooks]

[loggers]
keys = root,sentinel,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sentinel]
level = INFO
handlers = console
qualname = sentinel

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
